theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/img/nextflow_logo_dark.png
  favicon: assets/img/nextflow-icon.png
  palette:
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  font:
    text: Inter
    code: Roboto Mono
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - search.share
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    admonition:
      catalog: octicons/repo-16
      courses: octicons/log-16
      terminal: octicons/terminal-16
      full-code: material/code-block-braces
      optional: material/book-open-variant
      learning: octicons/mortar-board-16
      people: octicons/people-16
      licensing: octicons/law-16
      videos: octicons/video-16

extra_css:
  - assets/stylesheets/fonts.css
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/posthog.js
  - assets/javascripts/language-picker.js

# Set in overrides/partials/copyright.html
# so that we can have links and stuff
# copyright: Seqera

extra:
  # Use root path for localStorage keys so consent/palette work across all versions and languages
  scope: /
  # Non-clickable group labels shown above the matching top-level nav section
  # in the left sidebar. Key = exact top-level nav title. Rendered by
  # overrides/partials/nav.html. Add more entries here to label further groups.
  nav_group_labels:
    "Training Environment": Setup & Help
    "Nextflow Run": Users
    "Hello Nextflow": Developers
  # Per-section nav title overrides, keyed by the section's index page
  # source path (relative to docs_dir). Takes precedence over the page's
  # own title, for when the nav label should differ from the page itself.
  # Applied by generate_renamed_section_items in _scripts/mkdocs_hooks.py.
  nav_title_overrides:
    envsetup/index.md: Training Environment
    nextflow_run/index.md: Nextflow Run
    nfcore_run/index.md: Use nf-core
    seqera_run/index.md: Scale with Seqera
    nextflow_config/index.md: Nextflow Config
    hello_nextflow/index.md: Hello Nextflow
    hello_nf-core/index.md: Build with nf-core
    nf4_science/index.md: Nextflow for Science
    nf4_science/genomics/index.md: "Genomics"
    nf4_science/rnaseq/index.md: "RNAseq"
    nf4_science/imaging/index.md: "Imaging"
    side_quests/index.md: Side Quests
  # Non-clickable separators inside a nested nav list, keyed by the source
  # path of the child page the separator should appear directly above.
  # Rendered by overrides/partials/nav-item.html.
  nav_section_separators:
    side_quests/dev_environment/index.md: Developer Tools & Tricks
    side_quests/working_with_files/index.md: Deep Dives into Dataflow
    side_quests/workflows_of_workflows/index.md: Modular Architecture in Action
    side_quests/nf_test/index.md: The Nextflow Extended Universe
  # Announcement banner for upcoming training
  announcement:
    active: true
    text: "Nextflow Training Week (2025-Q1):"
    text_bold: March 10-14, 2025
    url: https://community.seqera.io/t/nextflow-training-week-2025-q1/1775/6
    url_text: More info
    hide_after: 2025-03-15
  # Analytics
  analytics:
    provider: google
    property: G-244N3GEN75
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our training materials better.
      Find out more on
      <a href="https://seqera.io/privacy-policy/#cookies" target="_blank" rel="noopener">how we use cookies</a>.
    cookies:
      posthog: PostHog Analytics
  # Overridden in overrides/partials/social.html
  # Still needs to be set to something here so that the partial is used
  social:
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/nextflowio
      name: Nextflow on twitter
  version:
    provider: mike
    alias: true
  # Language picker
  # Links use defined base paths; JS in main.html fixes for mike versioning
  alternate:
    - name: English
      link: /
      lang: en
    - name: Català
      link: /ca/
      lang: ca
    - name: deutsch
      link: /de/
      lang: de
    - name: español
      link: /es/
      lang: es
    - name: français
      link: /fr/
      lang: fr
    - name: हिन्दी
      link: /hi/
      lang: hi
    - name: italiano
      link: /it/
      lang: it
    - name: 한국어
      link: /ko/
      lang: ko
    - name: Polski
      link: /pl/
      lang: pl
    - name: português
      link: /pt/
      lang: pt
    - name: Türkçe
      link: /tr/
      lang: tr

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.blocks.caption
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: [".", "../.."]
  - pymdownx.superfences:
      preserve_tabs: true
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - tables
  - toc:
      title: On this page
      permalink: true

plugins:
  - enumerate-headings:
      restart_increment_after:
        - envsetup/01_setup.md
        - nextflow_run/00_orientation.md
        - nfcore_run/00_orientation.md
        - seqera_run/00_orientation.md
        - nextflow_config/00_orientation.md
        - hello_nextflow/00_orientation.md
        - hello_nf-core/00_orientation.md
        - nf4_science/genomics/00_orientation.md
        - nf4_science/rnaseq/00_orientation.md
        - side_quests/orientation.md

      exclude:
        - index*.md
        - help*.md
        - training_events*.md
        - info/*.md
        - envsetup/*.md
        - nextflow_run/*.md
        - nfcore_run/*.md
        - seqera_run/*.md
        - nextflow_config/*.md
        - hello_nextflow/*.md
        - hello_nf-core/*.md
        - nf4_science/genomics/*.md
        - nf4_science/rnaseq/*.md
        - nf4_science/imaging/*.md
        - side_quests/*.md
        - side_quests/**/*.md

  - search
  - mkdocs_quiz:
      progress_sidebar_position: bottom
  - redirects:
      redirect_maps:
        "training_collections/index.md": "side_quests/index.md"
        "training_collections/architects_toolkit_1.md": "side_quests/index.md#suggested-path-the-architects-toolkit-i"
        "training_collections/nextflow_triathlon.md": "nextflow_run/index.md"
        "nextflow_run/01_basics.md": "https://training.nextflow.io/3.6.1/nextflow_run/01_basics/"
        "nextflow_run/02_pipeline.md": "https://training.nextflow.io/3.6.1/nextflow_run/02_pipeline/"
        "nextflow_run/03_config.md": "https://training.nextflow.io/3.6.1/nextflow_run/03_config/"
        "hello_nf-core/02_rewrite_hello.md": "hello_nf-core/01_rewrite_hello.md"
        "hello_nf-core/03_use_module.md": "hello_nf-core/02_use_module.md"
        "hello_nf-core/04_make_module.md": "hello_nf-core/03_make_module.md"
        "hello_nf-core/05_input_validation.md": "hello_nf-core/04_input_validation.md"
        "hello_nf-core/01_run_demo.md": "nfcore_run/01_run_demo.md"
hooks:
  - ../../_scripts/mkdocs_hooks.py
  - ../en/hooks/index_page_hook.py
