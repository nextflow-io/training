name: Docs preview

# Deploys the `site` artifact of a PR's "Docs build" run as a Cloudflare Preview named
# pr-<N> (its own workers.dev URL) of the assets-only Worker in docs/wrangler.preview.jsonc,
# and deletes the Preview when the PR closes. A sticky PR comment shows the status.
#
# Fork PRs get no secrets in pull_request runs, so the build and the deploy are split.
# This workflow runs in the base repository's context: it uses the default branch's
# wrangler config and never checks out or runs PR code. The artifact is only uploaded.
#
# Repository secrets:
#   CLOUDFLARE_PREVIEW_API_TOKEN_TRAINING_REPO  "Workers Scripts: Edit", scoped to the preview Worker only
#   CLOUDFLARE_ACCOUNT_ID_TRAINING_REPO
# `wrangler preview` needs the Worker in docs/wrangler.preview.jsonc to exist: deploy it
# once by hand first (any dist-preview/ contents will do).

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] PR code is never checked out; the artifact is data
    workflows: [Docs build]
    types: [completed]
  pull_request_target: # zizmor: ignore[dangerous-triggers] closed only, deletes the Preview; no PR code
    types: [closed]

permissions: {}

defaults:
  run:
    shell: bash
    working-directory: docs/worker

jobs:
  pr:
    name: Find the pull request
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["success", "failure", "timed_out"]'), github.event.workflow_run.conclusion) &&
      github.event.workflow_run.actor.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
    steps:
      # workflow_run.pull_requests is empty for fork PRs, so match the open PR by head.
      - name: Find the pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data } = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
            });
            const pr = data.find((p) => p.head.sha === run.head_sha);
            if (pr) core.setOutput('number', pr.number);
            else core.notice('No open pull request has this commit as its head, so there is nothing to deploy.');

  deploy:
    name: Deploy preview
    needs: pr
    if: needs.pr.outputs.number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      pull-requests: write
    concurrency:
      group: docs-preview-pr-${{ needs.pr.outputs.number }}
      cancel-in-progress: false
    env:
      PR: ${{ needs.pr.outputs.number }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      BUILT: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out the default branch's wrangler config
        if: env.BUILT == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            docs/.nvmrc
            docs/wrangler.preview.jsonc
            docs/worker/package.json
            docs/worker/package-lock.json

      - name: Set up Node.js
        if: env.BUILT == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/.nvmrc

      - name: Install wrangler
        if: env.BUILT == 'true'
        run: npm ci

      # Production URLs live under /latest/, so the preview does too.
      - name: Download site
        if: env.BUILT == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: docs/dist-preview/latest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Add redirects and headers
        if: env.BUILT == 'true'
        working-directory: docs/dist-preview
        run: |
          printf '/ /latest/ 302\n' > _redirects
          printf '/*\n  X-Robots-Tag: noindex\n' > _headers

      - name: Deploy to Cloudflare
        id: deploy
        if: env.BUILT == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN_TRAINING_REPO }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_TRAINING_REPO }}
        run: |
          npx wrangler preview -c ../wrangler.preview.jsonc --name "pr-$PR" \
            --message "PR #$PR @ ${SHA:0:7}" --json | tee preview.json
          # wrangler prints progress lines before the JSON object; keep only the object.
          url=$(sed -n '/^{$/,/^}$/p' preview.json | jq -er '.preview.urls[0]') || {
            echo "::error::wrangler did not report a preview URL (see the output above)."
            exit 1
          }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Update the preview comment
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STATE: ${{ env.BUILT != 'true' && 'build-failed' || job.status }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          RUN_URL: ${{ env.BUILT != 'true' && github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        with:
          script: &comment |
            const MARKER = '<!-- cloudflare-preview-comment -->';
            const { PR, SHA, STATE, PREVIEW_URL, RUN_URL } = process.env;
            const short = SHA.slice(0, 7);
            const status = {
              success: `✅ **Preview ready:** ${PREVIEW_URL}\n\nBuilt from \`${short}\`.`,
              'build-failed': `❌ **Docs build failed** for \`${short}\`. See the [build logs](${RUN_URL}).`,
              removed: '🗑️ The preview was deleted because the PR was closed.',
              'cleanup-failed': `⚠️ The preview could not be deleted automatically. See the [run logs](${RUN_URL}).`,
            }[STATE] ?? `❌ **Preview failed** for \`${short}\`. See the [run logs](${RUN_URL}).`;
            const body = [MARKER, '### Cloudflare preview', '', status, '', `<sub>Updated ${new Date().toISOString()}</sub>`].join('\n');
            const params = { ...context.repo, issue_number: Number(PR) };
            const comments = await github.paginate(github.rest.issues.listComments, { ...params, per_page: 100 });
            const existing = comments.find((c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(MARKER));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...params, body });

  cleanup:
    name: Delete preview
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    concurrency:
      group: docs-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the default branch's wrangler config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            docs/.nvmrc
            docs/wrangler.preview.jsonc
            docs/worker/package.json
            docs/worker/package-lock.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/.nvmrc

      - name: Install wrangler
        run: npm ci

      # A PR whose build never succeeded has no Preview to delete.
      - name: Delete Cloudflare Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN_TRAINING_REPO }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_TRAINING_REPO }}
        run: |
          if ! npx wrangler preview delete -c ../wrangler.preview.jsonc --name "pr-$PR" --skip-confirmation 2>&1 | tee delete.log; then
            grep -qi 'not found' delete.log || exit 1
          fi

      - name: Update the preview comment
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STATE: ${{ job.status == 'success' && 'removed' || 'cleanup-failed' }}
          RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        with:
          script: *comment
